[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.105"
axum = { version = "0.8.9", features = ["ws"] }
clickhouse = "0.15.3"
futures = "0.3.34"
pulsar = "6.9.1"
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tower-http = { version = "0.7.1", features = [
    "trace",
    "cors"
] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.29.3", features = ["v7", "serde"] }
