[package]
name = "ingestor"
version = "0.1.0"
edition = "2024"

[dependencies]
async-channel = "2.5.0"
tokio = { version = "1.54.1", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
anyhow = "1.0.104"
dotenvy = "0.15.7"
futures-util = "0.3.34"
tracing = "0.1.44"
tokio-tungstenite = { version = "0.30.0", features = [
    "rustls-tls-webpki-roots"
] }
rustls = { version = "0.23.46", features = ["ring"] }
tracing-subscriber = "0.3.23"
chrono = { version = "0.4.45", features = ["serde"] }
rust_decimal = "1.43.0"
pulsar = "6.9.1"
rmp-serde = "1.3.1"
