[package]
name = "aggregator"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
flate2 = "1.1.11"
pulsar = "6.9.1"
questdb-rs = "7.3.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
num-bigint = "0.4.8"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
