[package]
name = "merger"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
dotenvy = "0.15.7"
futures-util = "0.3.34"
pulsar = "6.9.1"
questdb-rs = "7.3.0"
redis = { version = "0.32.7", default-features = false, features = [
    "connection-manager",
    "tokio-comp",
] }
regex = "1.12.2"
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10.9"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
